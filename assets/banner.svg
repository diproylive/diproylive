<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#bg)"/>

  <!-- Glowing Orbs -->
  <circle cx="150" cy="90" r="80" fill="#00F5D4" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="280" r="100" fill="#7B2CBF" opacity="0.2" filter="url(#glow)"/>

  <!-- Left Text Section -->
  <text x="80" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="28" fill="#00F5D4" letter-spacing="4">
    HELLO, I'M
  </text>
  
  <text x="76" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="88" fill="url(#textGrad)" filter="url(#glow)">
    Dip Roy
  </text>

  <text x="80" y="295" font-family="'Fira Code', monospace" font-size="24" fill="#E0E1DD" opacity="0.9">
    Software Engineer &amp; Mobile Application Developer
  </text>

  <!-- Right Phone & Tech Floating Badges -->
  <g transform="translate(850, 45)">
    <!-- Phone Container -->
    <rect width="180" height="290" rx="30" fill="#090d16" stroke="#00F5D4" stroke-width="3" filter="url(#glow)"/>
    <rect x="65" y="12" width="50" height="6" rx="3" fill="#1c2541"/>
    
    <!-- Phone Screen Content -->
    <rect x="20" y="40" width="140" height="70" rx="12" fill="#00F5D4" opacity="0.2"/>
    <rect x="20" y="125" width="100" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
    <rect x="20" y="147" width="140" height="10" rx="5" fill="#ffffff" opacity="0.25"/>
    <rect x="20" y="165" width="120" height="10" rx="5" fill="#ffffff" opacity="0.25"/>
    
    <!-- Connect Button -->
    <rect x="20" y="205" width="140" height="48" rx="14" fill="url(#textGrad)"/>
    <text x="90" y="235" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">
      Connect
    </text>
  </g>

  <!-- Floating Tech Pills -->
  <g font-family="'Fira Code', monospace" font-size="14" font-weight="600">
    <!-- React Native -->
    <rect x="710" y="110" width="140" height="36" rx="18" fill="#1c2541" stroke="#61DAFB" stroke-width="2"/>
    <text x="780" y="133" fill="#61DAFB" text-anchor="middle">⚛️ React Native</text>

    <!-- Node.js -->
    <rect x="690" y="185" width="110" height="36" rx="18" fill="#1c2541" stroke="#339933" stroke-width="2"/>
    <text x="745" y="208" fill="#339933" text-anchor="middle">💚 Node.js</text>

    <!-- AI -->
    <rect x="740" y="255" width="85" height="36" rx="18" fill="#1c2541" stroke="#FF6F00" stroke-width="2"/>
    <text x="782" y="278" fill="#FF6F00" text-anchor="middle">🤖 AI</text>
  </g>
</svg>