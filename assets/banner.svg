<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"><animate attributeName="stop-color" values="#0F2027;#16313d;#0F2027" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"><animate attributeName="stop-color" values="#2C5364;#1d3f52;#2C5364" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/><stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- floating glow orbs -->
  <circle cx="160" cy="80" r="70" fill="#36BCF7" opacity=".18" filter="url(#glow)">
    <animate attributeName="cy" values="80;130;80" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="240" r="90" fill="#7C5CFF" opacity=".2" filter="url(#glow)">
    <animate attributeName="cy" values="240;180;240" dur="9s" repeatCount="indefinite"/></circle>

  <!-- grid dots -->
  <g fill="#ffffff" opacity=".08">
    <circle cx="60" cy="40" r="2"/><circle cx="120" cy="40" r="2"/><circle cx="180" cy="40" r="2"/>
    <circle cx="60" cy="100" r="2"/><circle cx="120" cy="100" r="2"/><circle cx="180" cy="100" r="2"/>
  </g>

  <!-- name -->
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#36BCF7" letter-spacing="6" opacity="0">
    HELLO, I'M
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>
  <text x="76" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#accent)" opacity="0">
    Dip Roy
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" begin="0.4s" dur="1s" fill="freeze"/>
  </text>
  <rect x="80" y="245" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" from="0" to="260" begin="1s" dur="1s" fill="freeze"/>
  </rect>

  <!-- rotating roles -->
  <g font-family="Fira Code, Consolas, monospace" font-size="22" fill="#cfe9f5">
    <text x="80" y="285" opacity="0">Software Engineer
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="9s" repeatCount="indefinite"/></text>
    <text x="80" y="285" opacity="0">React Native Developer
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="9s" repeatCount="indefinite"/></text>
    <text x="80" y="285" opacity="0">Full Stack &amp; Real-Time Apps
      <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;0" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <!-- phone mockup -->
  <g transform="translate(860,40)">
    <animateTransform attributeName="transform" type="translate" values="860,40;860,28;860,40" dur="5s" repeatCount="indefinite"/>
    <rect width="150" height="250" rx="26" fill="#0b1820" stroke="url(#accent)" stroke-width="3"/>
    <rect x="55" y="10" width="40" height="6" rx="3" fill="#2C5364"/>
    <rect x="16" y="36" width="118" height="54" rx="10" fill="#36BCF7" opacity=".25"/>
    <rect x="16" y="102" width="82" height="10" rx="5" fill="#ffffff" opacity=".35"/>
    <rect x="16" y="122" width="118" height="10" rx="5" fill="#ffffff" opacity=".2"/>
    <rect x="16" y="142" width="100" height="10" rx="5" fill="#ffffff" opacity=".2"/>
    <rect x="16" y="176" width="118" height="40" rx="12" fill="url(#accent)">
      <animate attributeName="opacity" values="1;.6;1" dur="2.5s" repeatCount="indefinite"/></rect>
    <text x="75" y="201" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">Connect</text>
  </g>

  <!-- code chips -->
  <g font-family="Fira Code, Consolas, monospace" font-size="16" fill="#9fdcf7">
    <text x="1050" y="90" opacity=".7">&lt;React /&gt;<animate attributeName="y" values="90;80;90" dur="4s" repeatCount="indefinite"/></text>
    <text x="1040" y="160" opacity=".7">Node.js<animate attributeName="y" values="160;172;160" dur="6s" repeatCount="indefinite"/></text>
    <text x="1060" y="230" opacity=".7">{ API }<animate attributeName="y" values="230;220;230" dur="5s" repeatCount="indefinite"/></text>
    <text x="760" y="70" opacity=".6">WebRTC<animate attributeName="y" values="70;82;70" dur="5.5s" repeatCount="indefinite"/></text>
  </g>
</svg>
